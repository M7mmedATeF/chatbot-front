name: Build and Deploy to Server

on:
  push:
    branches: [dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.6.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Setup SSH
        run: |
          # Check if required secrets are set
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
          echo "Error: SSH_KEY secret is not set"
          exit 1
          fi
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
          echo "Error: SSH_HOST secret is not set"
          exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
          echo "Error: SSH_USER secret is not set"
          exit 1
          fi
          if [ -z "${{ secrets.PROJECT_PATH }}" ]; then
          echo "Error: PROJECT_PATH secret is not set"
          exit 1
          fi
        #   mkdir -p ~/.ssh/
        #   echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        #   chmod 600 ~/.ssh/id_rsa
        #   ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          echo "Deploying to server..."
          rsync -avz --delete \
              -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
              ./dist/ \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_PATH }}
      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
              echo '=== Deployment Contents ==='
              ls -la ${{ secrets.PROJECT_PATH }}
              echo ''
              echo '=== Checking key files ==='
              if [ -f '${{ secrets.PROJECT_PATH }}/index.html' ]; then
              echo '✓ index.html exists'
              else
              echo '✗ index.html missing'
              exit 1
              fi
              if [ -d '${{ secrets.PROJECT_PATH }}/assets' ]; then
              echo '✓ assets directory exists'
              else
              echo '✗ assets directory missing'
              exit 1
              fi
              echo '=== Deployment verification complete ==='
          "
